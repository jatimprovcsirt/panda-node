name: Publish Node.js Package to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    
    # Required for npm provenance
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 alone is not enough, and this is the step that is easy to
      # miss. Trusted publishing needs npm CLI >= 11.5.1 — but every Node 22
      # release ships npm 10.9.x, including 22.23.3. The bundled npm cannot
      # do OIDC no matter how new the Node version is, so it gets replaced.
      #
      # npm 12 changed three install defaults: lifecycle scripts off, git
      # dependencies off, remote tarballs off. All three were checked against
      # this project before upgrading — `npm ci --ignore-scripts` plus the
      # full suite still passes 200/200, because esbuild's binary comes from
      # its platform optional dependency and not from the postinstall it also
      # ships. No dependency here resolves from a git URL or a remote
      # tarball, and the lockfile is version 3.
      #
      # Worth re-checking if a dependency is ever added that builds from
      # source: it would need `npm approve-scripts` and a committed allowlist.
      #
      # npm 12 also has a Node floor of its own: 12.2.0 supports
      # ^22.22.2 || ^24.15.0 || >=26.0.0. `node-version: '22'` resolves to the
      # newest 22.x — 22.23.3 at the time of writing — so it clears that. It
      # would not if this were pinned to an older 22.x, and the symptom is a
      # warning on every npm invocation rather than an obvious failure.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^12
          npm --version

      - name: Install dependencies
        run: npm ci

      # `npm test` runs the build first via a pretest script. On a fresh
      # clone there is no dist/, and four test files spawn
      # dist/cli/index.js — this step failed for exactly that reason until
      # the pretest script existed.
      - name: Run Tests
        run: npm run test

      - name: Build project
        run: npm run build

      # No NODE_AUTH_TOKEN. Authentication is OIDC: npm exchanges the
      # workflow's id-token for a short-lived credential scoped to this
      # repository and this workflow file, which is why `id-token: write`
      # above is load-bearing rather than incidental.
      #
      # This replaced a granular access token, which no longer works for
      # direct publishing: as of July 2026 a bypass-2FA token cannot perform
      # account or package management, and from January 2027 it loses direct
      # publish as well, keeping only `npm stage publish`. A token would have
      # bought three months.
      #
      # --provenance is now implied when publishing this way from a public
      # repository; it is kept because stating it costs nothing and makes the
      # intent readable.
      #
      # Setup: npmjs.com -> the package -> Settings -> Trusted publishing ->
      # GitHub Actions, with organization `jatimprovcsirt`, repository
      # `panda-node`, and workflow filename `release.yml`. The filename must
      # match exactly; a mismatch appears at publish time as ENEEDAUTH. A new
      # configuration expires if it does not complete a publish within 2 days.
      - name: Publish to npm
        run: npm publish --provenance --access public
